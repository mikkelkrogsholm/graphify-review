[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify-review"
version = "0.1.0"
description = "Human-readable Git and PR reviews: graphs, pseudocode, blast radius, and pinned source evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
dependencies = ["graphifyy==0.9.92", "networkx>=3.4,<4"]

[project.urls]
Repository = "https://github.com/mikkelkrogsholm/graphify-review"
Issues = "https://github.com/mikkelkrogsholm/graphify-review/issues"

[project.optional-dependencies]
llm = ["graphifyy[openai]==0.9.92"]

[project.scripts]
graphify-review = "graphify_review.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15", "pyright>=1.1.409", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "dist", "build", "graphify-review-out"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
